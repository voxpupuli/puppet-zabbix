---
Gemfile:
  optional:
    ':test':
      - gem: 'fakefs'
      - gem: 'zabbixapi'
      - gem: 'rexml'
spec/spec_helper.rb:
  spec_overrides:
    - "require 'support/acceptance/supported_versions'"
.puppet-lint.rc:
  enabled_lint_checks:
    - parameter_documentation
.github/workflows/ci.yml:
  with:
    beaker_facter: 'zabbix_version:Zabbix:7.0'
